resources:
  repositories:
    - repository: templates
      type: git
      name: ROMTech/PipelineTemplates

trigger:
  - test

pool:
  vmImage: ubuntu-latest

name: ROMTechSolutions_$(Build.DefinitionName)_$(Build.SourceBranch)_$(Date:yyyyMMdd).$(Rev:r)

variables:
  - template: templates/insert-variables-test.yml
  - template: insert-variables-dynamic.yml@templates

stages:
  - template: insert-stage-variables-confirm.yml@templates

  # Copy the LibreChat image into THIS environment's registry, before Bicep points the
  # Container App at it.
  #
  # The fork repo (ChatGptForEmployeesLibreChatFork) builds LibreChat exactly once, into
  # acrcgfedev. libreChat.bicep gives the Container App pull credentials for acrcgfe<env>
  # and nothing else, so test cannot pull from the dev registry — the image has to exist
  # here. Promotion is a registry copy, never a rebuild: `az acr import` preserves the
  # digest, so test runs the bit-identical image that was validated in dev.
  #
  # ORDER: runs BEFORE BicepWhatIf/BicepCreate. Reordered 2026-08-05; it previously ran after
  # BicepCreate. Importing first means the image is already in acrcgfetest when Bicep points the
  # Container App at that digest, so the new revision pulls on creation and comes up healthy.
  #
  # Running it after meant Bicep created a revision that could not pull, which stayed unhealthy
  # (activeRevisionsMode 'Single' kept the previous one serving, so nothing went down) until the
  # later DeployLibreChat restart retried the pull. That made the restart the recovery mechanism
  # for image rollout — a path never actually exercised, and one where the intervening
  # UploadConfigs/DeployLiteLLM/DeployRagApi stages could push the revision past its progress
  # deadline first. It also meant a failed BicepCreate gated the import off, so a re-run could not
  # self-heal: the image could never land without a hand-run import.
  #
  # The only thing the old order bought was first-run bootstrap — the registry existing before the
  # import. Both target registries already exist, and the check below handles the case anyway.
  #
  # TO REVERT: move this stage back below the insert-stage-bicep-create template and restore
  #   dependsOn: BicepCreate
  #   condition: in(dependencies.BicepCreate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
  # Nothing else needs changing — the downstream stages check both BicepCreate and this stage's
  # results either way. See LibreChat_Image_Deployments.md §3.
  - stage: ImportLibreChatImage
    displayName: 'Import LibreChat image into acrcgfetest'
    jobs:
      - job: ImportImage
        displayName: 'az acr import librechat@<digest> -> acrcgfetest'
        steps:
          - task: AzureCLI@2
            displayName: 'Copy the pinned digest from acrcgfedev'
            inputs:
              # Use the Dev SC: it owns acrcgfedev (can read admin credentials) and has
              # Container Registry Data Importer and Data Reader on acrcgfetest.
              # The Test SC cannot read acrcgfedev credentials, so this step is an
              # intentional cross-environment exception.
              azureSubscription: ChatGptForEmployeesDevSC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                SOURCE_ACR="acrcgfedev"
                TARGET_ACR="acrcgfetest"
                PARAM_FILE="$(Build.SourcesDirectory)/ChatGptForEmployees.bicep/main.test.bicepparam"

                # Read the digest from the param file rather than restating it in pipeline
                # config: libreChatImage stays the single place a deploy is pinned.
                IMAGE_REF=$(grep -E "^param libreChatImage" "$PARAM_FILE" | sed "s/.*=[[:space:]]*'\(.*\)'.*/\1/")
                echo "libreChatImage = $IMAGE_REF"

                # Three cases, deliberately distinguished:
                #   1. This environment's own ACR  -> import it.
                #   2. A DIFFERENT acrcgfe* host   -> FAIL. This is the footgun the deployment log
                #      warns about: leave acrcgfedev in main.<env>.bicepparam and BicepCreate points
                #      this environment at a lower one's registry, the pull fails for want of
                #      credentials, and the previous revision keeps serving — a green run on a stale
                #      image. This stage is the only thing positioned to catch it, so it must not
                #      shrug and exit 0.
                #   3. Anything else (upstream's public ghcr.io image) -> no-op. It pulls without
                #      credentials, so there is nothing to copy, and this keeps the stage harmless
                #      on a branch that predates the fork migration.
                case "$IMAGE_REF" in
                  ${TARGET_ACR}.azurecr.io/*) ;;
                  acrcgfe*.azurecr.io/*)
                    echo "##vso[task.logissue type=error]libreChatImage points at a DIFFERENT environment's registry: ${IMAGE_REF}. It must use ${TARGET_ACR}.azurecr.io — libreChat.bicep only has pull credentials for this environment's own ACR, so this would deploy an image the app cannot pull while the old revision keeps serving."
                    exit 1 ;;
                  *) echo "Not an ${TARGET_ACR} reference — nothing to import."; exit 0 ;;
                esac

                # Bootstrap: on a brand-new environment the registry may not exist yet, because
                # BicepCreate — which creates it — now runs after this stage. Skip rather than fail;
                # that run deploys an app whose image isn't there (old revision keeps serving), and
                # the next run imports it. One-time, and not a case either target hits today.
                if ! az acr show --name "$TARGET_ACR" --output none 2>/dev/null; then
                  echo "${TARGET_ACR} does not exist yet — skipping. BicepCreate will create it; the next run will import."
                  exit 0
                fi

                REPO_AND_DIGEST="${IMAGE_REF#*.azurecr.io/}"
                REPOSITORY="${REPO_AND_DIGEST%@*}"
                DIGEST="${REPO_AND_DIGEST#*@}"

                # Idempotent: a redeploy of an unchanged param costs one lookup, not a copy.
                if az acr repository show --name "$TARGET_ACR" \
                     --image "${REPOSITORY}@${DIGEST}" --output none 2>/dev/null; then
                  echo "Digest already present in ${TARGET_ACR} — skipping import."
                  exit 0
                fi

                # az acr import requires a tag as target — digest refs are invalid for TargetTags.
                # Derive a short unique tag from the digest (first 12 hex chars after "sha256:").
                SHORT="${DIGEST:7:12}"

                # Dev SC has admin access to acrcgfedev and Data Importer on acrcgfetest.
                SOURCE_USER=$(az acr credential show --name "$SOURCE_ACR" --query "username" -o tsv)
                SOURCE_PASS=$(az acr credential show --name "$SOURCE_ACR" --query "passwords[0].value" -o tsv)
                # Register as a secret so ADO masks it in the log. It is passed as a process
                # argument below, and `az --debug` — which this stage's own docs invite you to add
                # when diagnosing — echoes the full command line. Without this the dev registry's
                # admin password lands in a retained build log in clear text.
                echo "##vso[task.setvariable variable=srcPass;issecret=true]${SOURCE_PASS}"

                echo "Importing ${DIGEST} from ${SOURCE_ACR} as :${SHORT}..."
                if ! az acr import --name "$TARGET_ACR" \
                       --source "${SOURCE_ACR}.azurecr.io/${REPOSITORY}@${DIGEST}" \
                       --image "${REPOSITORY}:${SHORT}" \
                       --username "$SOURCE_USER" \
                       --password "$SOURCE_PASS"; then
                  echo "##vso[task.logissue type=error]Import failed."
                  exit 1
                fi

                # Verify rather than assume. A missing image does not fail the deploy loudly:
                # the new revision never goes healthy and activeRevisionsMode 'Single' keeps
                # the old one serving, so it presents as a working app on a failed deploy.
                az acr repository show --name "$TARGET_ACR" \
                  --image "${REPOSITORY}@${DIGEST}" \
                  --query "{digest:digest, arch:architecture, os:os}" -o json
                echo "Imported into ${TARGET_ACR} and verified."

  - template: insert-stage-bicep-whatif.yml@templates
    parameters:
      # Opt out of incremental detection — see the long note in `dev.yml`. Short version: the
      # detect step diffs against the last successful run of this pipeline definition on ANY ref,
      # so a PR validation build becomes the baseline and the real merge sees no changes; when it
      # skips, `BicepWhatIf` and `BicepCreate` are both Skipped, the run still goes green, and the
      # app restarts on its previous image. An empty value takes the template's documented
      # "no folder resolved → run the stage" path.
      bicepDetectFolder: ''
      bicepParamFile: $(bicepParamFile)
      bicepWorkingDirectory: $(bicepWorkingDirectory)
      resourceGroup: $(resourceGroup)
      serviceConnection: $(serviceConnection)

  - template: insert-stage-bicep-create.yml@templates
    parameters:
      appNameEnv: $(appName)
      bicepParamFile: $(bicepParamFile)
      bicepWorkingDirectory: $(bicepWorkingDirectory)
      envName: $(envName)
      resourceGroup: $(resourceGroup)
      serviceConnection: $(serviceConnection)

  - stage: BuildJobsImage
    displayName: 'Build & push scheduled-jobs image'
    # Depends on BOTH, and checks BOTH. ImportLibreChatImage is itself gated on BicepCreate, so a
    # FAILED BicepCreate makes the import 'Skipped' — and checking only the import would then treat
    # a failed infrastructure deploy as fine and carry on uploading config and restarting apps.
    # 'Skipped' on the import legitimately means BicepCreate was skipped; image-already-present is
    # 'Succeeded' (the script exits 0), not 'Skipped'.
    dependsOn:
      - BicepCreate
      - ImportLibreChatImage
    condition: and(in(dependencies.BicepCreate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.ImportLibreChatImage.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
    jobs:
      - job: BuildPush
        displayName: 'az acr build Dockerfile.cleanup -> acrcgfetest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build & push librechat-cleanup image to ACR'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr build \
                  --registry acrcgfetest \
                  --image librechat-cleanup:latest \
                  --file "$(Build.SourcesDirectory)/ChatGptForEmployees/scripts/Dockerfile.cleanup" \
                  "$(Build.SourcesDirectory)/ChatGptForEmployees/scripts"

  - stage: UploadConfigs
    displayName: 'Upload Config Files to Azure Files'
    # Depends on BOTH, and checks BOTH. ImportLibreChatImage is itself gated on BicepCreate, so a
    # FAILED BicepCreate makes the import 'Skipped' — and checking only the import would then treat
    # a failed infrastructure deploy as fine and carry on uploading config and restarting apps.
    # 'Skipped' on the import legitimately means BicepCreate was skipped; image-already-present is
    # 'Succeeded' (the script exits 0), not 'Skipped'.
    dependsOn:
      - BicepCreate
      - ImportLibreChatImage
    condition: and(in(dependencies.BicepCreate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.ImportLibreChatImage.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
    jobs:
      - job: UploadConfigs
        displayName: 'Upload litellm and librechat config'
        steps:
          - task: AzureCLI@2
            displayName: 'Upload config files to Azure File Shares'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                STORAGE_KEY=$(az storage account keys list \
                  --account-name $(storageAccountName) \
                  --resource-group $(resourceGroup) \
                  --query "[0].value" \
                  --output tsv)

                az storage file upload \
                  --account-name $(storageAccountName) \
                  --account-key "$STORAGE_KEY" \
                  --share-name litellm-config \
                  --source "$(Build.SourcesDirectory)/ChatGptForEmployees/config/litellm_routing_config.yaml" \
                  --path "litellm_routing_config.yaml"

                LITELLM_FQDN=$(az containerapp show \
                  --name $(appNameEnvLiteLLM) \
                  --resource-group $(resourceGroup) \
                  --query "properties.configuration.ingress.fqdn" \
                  --output tsv)
                LITELLM_URL="http://${LITELLM_FQDN}"

                sed "s|\${LITELLM_URL}|${LITELLM_URL}|g" \
                  "$(Build.SourcesDirectory)/ChatGptForEmployees/config/librechat.yaml" \
                  > /tmp/librechat_processed.yaml

                az storage file upload \
                  --account-name $(storageAccountName) \
                  --account-key "$STORAGE_KEY" \
                  --share-name librechat-data \
                  --source "/tmp/librechat_processed.yaml" \
                  --path "librechat.yaml"

  - stage: DeployLiteLLM
    displayName: 'Deploy LiteLLM'
    dependsOn: UploadConfigs
    # Explicit result check on the immediate parent. The default succeeded() is
    # evaluated over the whole upstream tree, so the Skipped BicepCreate ancestor
    # would poison it and skip this restart even though UploadConfigs succeeded.
    condition: in(dependencies.UploadConfigs.result, 'Succeeded', 'SucceededWithIssues')
    jobs:
      - job: RestartLiteLLM
        displayName: 'Restart LiteLLM Container App'
        steps:
          - task: AzureCLI@2
            displayName: 'Restart LiteLLM Container App'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                REVISION=$(az containerapp show \
                  --name $(appNameEnvLiteLLM) \
                  --resource-group $(resourceGroup) \
                  --query "properties.latestRevisionName" \
                  --output tsv)
                az containerapp revision restart \
                  --name $(appNameEnvLiteLLM) \
                  --resource-group $(resourceGroup) \
                  --revision "$REVISION"

  - stage: DeployRagApi
    displayName: 'Deploy RAG API'
    dependsOn: UploadConfigs
    # Explicit result check on the immediate parent (see DeployLiteLLM note) so a
    # Skipped BicepCreate ancestor doesn't poison the default succeeded().
    condition: in(dependencies.UploadConfigs.result, 'Succeeded', 'SucceededWithIssues')
    jobs:
      - job: RestartRagApi
        displayName: 'Restart RAG API Container App'
        steps:
          - task: AzureCLI@2
            displayName: 'Restart RAG API Container App'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                REVISION=$(az containerapp show \
                  --name $(appNameEnvRagApi) \
                  --resource-group $(resourceGroup) \
                  --query "properties.latestRevisionName" \
                  --output tsv)
                az containerapp revision restart \
                  --name $(appNameEnvRagApi) \
                  --resource-group $(resourceGroup) \
                  --revision "$REVISION"

  - stage: DeployLibreChat
    displayName: 'Deploy LibreChat'
    dependsOn:
      - BicepCreate
      - DeployLiteLLM
      - DeployRagApi
      - ImportLibreChatImage
    # Restart LibreChat only when LiteLLM, RAG API and the image import all succeeded, AND the
    # Bicep deploy itself did not fail. ImportLibreChatImage 'Skipped' means BicepCreate was
    # skipped or failed — NOT "image already present", which exits 0 and reports 'Succeeded' — so
    # without the BicepCreate check a failed ARM deploy would still restart the app.
    condition: and(in(dependencies.BicepCreate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.DeployLiteLLM.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.DeployRagApi.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.ImportLibreChatImage.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
    jobs:
      - job: RestartLibreChat
        displayName: 'Restart LibreChat Container App'
        steps:
          - task: AzureCLI@2
            displayName: 'Restart LibreChat Container App'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                REVISION=$(az containerapp show \
                  --name $(appNameEnvLibreChat) \
                  --resource-group $(resourceGroup) \
                  --query "properties.latestRevisionName" \
                  --output tsv)
                az containerapp revision restart \
                  --name $(appNameEnvLibreChat) \
                  --resource-group $(resourceGroup) \
                  --revision "$REVISION"

  - stage: DeployHelpPage
    displayName: 'Deploy Help Page to Static Web App'
    # Depends on BOTH, and checks BOTH. ImportLibreChatImage is itself gated on BicepCreate, so a
    # FAILED BicepCreate makes the import 'Skipped' — and checking only the import would then treat
    # a failed infrastructure deploy as fine and carry on uploading config and restarting apps.
    # 'Skipped' on the import legitimately means BicepCreate was skipped; image-already-present is
    # 'Succeeded' (the script exits 0), not 'Skipped'.
    dependsOn:
      - BicepCreate
      - ImportLibreChatImage
    condition: and(in(dependencies.BicepCreate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.ImportLibreChatImage.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
    jobs:
      - job: DeployHelp
        displayName: 'Push romtech_ai_help.html to the SWA'
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy help page via the SWA CLI'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # SWA content deploy needs the deployment token + the Static Web Apps
                # CLI — there is no `az` command to push content to a SWA. Resolve the
                # site by name-prefix within the RG, fetch its token, then deploy the
                # page as index.html so it serves at the site root.
                SWA_NAME=$(az staticwebapp list \
                  --resource-group $(resourceGroup) \
                  --query "[?starts_with(name, 'swa-cgfe')].name | [0]" -o tsv)
                TOKEN=$(az staticwebapp secrets list \
                  --name "$SWA_NAME" \
                  --resource-group $(resourceGroup) \
                  --query "properties.apiKey" -o tsv)
                mkdir -p /tmp/helpsite
                cp "$(Build.SourcesDirectory)/ChatGptForEmployees.docs/romtech_ai_help.html" /tmp/helpsite/index.html
                npx -y @azure/static-web-apps-cli deploy /tmp/helpsite \
                  --deployment-token "$TOKEN" \
                  --env production
