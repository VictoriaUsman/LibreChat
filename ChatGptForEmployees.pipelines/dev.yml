resources:
  repositories:
    - repository: templates
      type: git
      name: ROMTech/PipelineTemplates

trigger:
  - dev

pool:
  vmImage: ubuntu-latest

name: ROMTechSolutions_$(Build.DefinitionName)_$(Build.SourceBranch)_$(Date:yyyyMMdd).$(Rev:r)

variables:
  - template: templates/insert-variables-dev.yml
  - template: insert-variables-dynamic.yml@templates

stages:
  - template: insert-stage-variables-confirm.yml@templates

  - template: insert-stage-bicep-whatif.yml@templates
    parameters:
      # Opt out of incremental detection. `insert-stage-detect-folder-changes.yml` decides whether
      # to run by diffing the LAST SUCCESSFUL RUN OF THIS PIPELINE DEFINITION against HEAD —
      # `definitions=<id>&resultFilter=succeeded`, with no branch filter — and only runs the deploy
      # if a changed path falls under `bicepDetectFolder`. Two problems for us:
      #
      #   1. The base commit isn't the previous `dev` tip. Any successful run of this definition on
      #      any ref counts, so a PR build-validation run — which builds the PR's merge commit,
      #      already containing the change — becomes the baseline. The subsequent merge to `dev`
      #      then diffs against a commit that already had everything, sees nothing, and skips.
      #   2. When it skips, nothing fails. `BicepWhatIf` is conditioned on `RunStage == 'true'` and
      #      `BicepCreate` on `succeeded('BicepWhatIf')`, so both are Skipped, the run goes green,
      #      and the restart stages (which tolerate a Skipped BicepCreate, PR 10964) cycle the app
      #      on its OLD image. A digest bump silently does nothing. This bit us twice: PR 11547
      #      (tag 25740) and PR 11602 (tag 26023).
      #
      # Passing an empty string takes the template's documented escape hatch — "If no folder
      # resolved, default to running the stage" — so whatif/create run on every push to this
      # branch. The cost is a couple of minutes and an idempotent ARM deployment on pushes that
      # changed no infra; the cost of the alternative is a deploy that silently doesn't happen.
      bicepDetectFolder: ''
      bicepParamFile: $(bicepParamFile)
      bicepWorkingDirectory: $(bicepWorkingDirectory)
      resourceGroup: $(resourceGroup)
      serviceConnection: $(serviceConnection)

  - template: insert-stage-bicep-create.yml@templates
    parameters:
      appNameEnv: $(appName)
      bicepParamFile: $(bicepParamFile)
      bicepWorkingDirectory: $(bicepWorkingDirectory)
      envName: $(envName)
      resourceGroup: $(resourceGroup)
      serviceConnection: $(serviceConnection)

  - stage: BuildJobsImage
    displayName: 'Build & push scheduled-jobs image'
    dependsOn: BicepCreate
    jobs:
      - job: BuildPush
        displayName: 'az acr build Dockerfile.cleanup -> acrcgfedev'
        steps:
          - task: AzureCLI@2
            displayName: 'Build & push librechat-cleanup image to ACR'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Build scripts/Dockerfile.cleanup server-side in ACR and push both
                # librechat-cleanup:latest (mutable, what jobs.bicep pulls by default)
                # and librechat-cleanup:$(Build.SourceVersion) (immutable, tied to the
                # exact reviewed commit). The ACA Jobs (jobs.bicep) pull the image via
                # admin credentials. Runs even while the Jobs are gated off
                # (deployJobs=false), so the image is ready when they're enabled.
                #
                # `set -e` (bash default here is NOT -e) so a failed build/digest
                # lookup fails this stage instead of silently leaving no recorded
                # digest for a commit that appears to have "built" (LiteLLM v1.99.0
                # review, third working-changes follow-up, Finding 2).
                set -euo pipefail

                az acr build \
                  --registry acrcgfedev \
                  --image "librechat-cleanup:latest" \
                  --image "librechat-cleanup:$(Build.SourceVersion)" \
                  --file "$(Build.SourcesDirectory)/ChatGptForEmployees/scripts/Dockerfile.cleanup" \
                  "$(Build.SourcesDirectory)/ChatGptForEmployees/scripts"

                # Record the manifest digest for the immutable, commit-pinned tag --
                # NOT the :latest tag, which a later push (e.g. from `dev` moving
                # again) can silently repoint out from under an in-flight cutover.
                # This is the digest REVIEW-AND-CUTOVER.md Step 8d requires an
                # operator to record and match against before starting the synthetic
                # check job. Cutover requires jobsImageDigest (jobs.bicep) and
                # an exact digest reference on the job and captured execution;
                # checking the mutable tag before starting is not sufficient.
                JOBS_IMAGE_DIGEST=$(az acr repository show \
                  --name acrcgfedev \
                  --image "librechat-cleanup:$(Build.SourceVersion)" \
                  --query "digest" \
                  --output tsv)

                if [ -z "$JOBS_IMAGE_DIGEST" ]; then
                  echo "##vso[task.logissue type=error]Could not resolve a manifest digest for librechat-cleanup:$(Build.SourceVersion) after build; treat this as a build failure."
                  exit 1
                fi

                echo "##vso[task.setvariable variable=jobsImageDigest;isOutput=true]$JOBS_IMAGE_DIGEST"
                echo "Built and pushed librechat-cleanup for commit $(Build.SourceVersion)"
                echo "  tags:   latest, $(Build.SourceVersion)"
                echo "  digest: $JOBS_IMAGE_DIGEST"
                echo "Record this commit + digest pair in the cutover evidence per REVIEW-AND-CUTOVER.md Step 8d prerequisites."
            name: BuildPushStep

  - stage: UploadConfigs
    displayName: 'Upload Config Files to Azure Files'
    dependsOn: BicepCreate
    # Config files (litellm_routing_config.yaml, librechat.yaml) change
    # independently of infrastructure. BicepCreate is Skipped when a push
    # touches no .bicep files, which previously skipped this stage AND the
    # restart stages that depend on it — so config-only changes never reached
    # the Azure File Shares. Run when BicepCreate Succeeded OR was Skipped;
    # only bail if it actually Failed.
    condition: in(dependencies.BicepCreate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
    jobs:
      - job: UploadConfigs
        displayName: 'Upload litellm and librechat config'
        steps:
          - task: AzureCLI@2
            displayName: 'Upload config files to Azure File Shares'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                STORAGE_KEY=$(az storage account keys list \
                  --account-name $(storageAccountName) \
                  --resource-group $(resourceGroup) \
                  --query "[0].value" \
                  --output tsv)

                az storage file upload \
                  --account-name $(storageAccountName) \
                  --account-key "$STORAGE_KEY" \
                  --share-name litellm-config \
                  --source "$(Build.SourcesDirectory)/ChatGptForEmployees/config/litellm_routing_config.yaml" \
                  --path "litellm_routing_config.yaml"

                LITELLM_FQDN=$(az containerapp show \
                  --name $(appNameEnvLiteLLM) \
                  --resource-group $(resourceGroup) \
                  --query "properties.configuration.ingress.fqdn" \
                  --output tsv)
                LITELLM_URL="http://${LITELLM_FQDN}"

                sed "s|\${LITELLM_URL}|${LITELLM_URL}|g" \
                  "$(Build.SourcesDirectory)/ChatGptForEmployees/config/librechat.yaml" \
                  > /tmp/librechat_processed.yaml

                az storage file upload \
                  --account-name $(storageAccountName) \
                  --account-key "$STORAGE_KEY" \
                  --share-name librechat-data \
                  --source "/tmp/librechat_processed.yaml" \
                  --path "librechat.yaml"

  - stage: DeployLiteLLM
    displayName: 'Deploy LiteLLM'
    dependsOn: UploadConfigs
    # Explicit result check on the immediate parent. The default succeeded() is
    # evaluated over the whole upstream tree, so the Skipped BicepCreate ancestor
    # would poison it and skip this restart even though UploadConfigs succeeded.
    condition: in(dependencies.UploadConfigs.result, 'Succeeded', 'SucceededWithIssues')
    jobs:
      - job: RestartLiteLLM
        displayName: 'Restart LiteLLM Container App'
        steps:
          - task: AzureCLI@2
            displayName: 'Restart LiteLLM Container App'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                REVISION=$(az containerapp show \
                  --name $(appNameEnvLiteLLM) \
                  --resource-group $(resourceGroup) \
                  --query "properties.latestRevisionName" \
                  --output tsv)
                az containerapp revision restart \
                  --name $(appNameEnvLiteLLM) \
                  --resource-group $(resourceGroup) \
                  --revision "$REVISION"

  - stage: DeployRagApi
    displayName: 'Deploy RAG API'
    dependsOn: UploadConfigs
    # Explicit result check on the immediate parent (see DeployLiteLLM note) so a
    # Skipped BicepCreate ancestor doesn't poison the default succeeded().
    condition: in(dependencies.UploadConfigs.result, 'Succeeded', 'SucceededWithIssues')
    jobs:
      - job: RestartRagApi
        displayName: 'Restart RAG API Container App'
        steps:
          - task: AzureCLI@2
            displayName: 'Restart RAG API Container App'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                REVISION=$(az containerapp show \
                  --name $(appNameEnvRagApi) \
                  --resource-group $(resourceGroup) \
                  --query "properties.latestRevisionName" \
                  --output tsv)
                az containerapp revision restart \
                  --name $(appNameEnvRagApi) \
                  --resource-group $(resourceGroup) \
                  --revision "$REVISION"

  - stage: DeployLibreChat
    displayName: 'Deploy LibreChat'
    dependsOn:
      - DeployLiteLLM
      - DeployRagApi
    # Explicit result check on the immediate parents (see DeployLiteLLM note).
    # Restart LibreChat when both upstream restarts succeeded; the default
    # succeeded() would be poisoned by the Skipped BicepCreate ancestor.
    condition: and(in(dependencies.DeployLiteLLM.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.DeployRagApi.result, 'Succeeded', 'SucceededWithIssues'))
    jobs:
      - job: RestartLibreChat
        displayName: 'Restart LibreChat Container App'
        steps:
          - task: AzureCLI@2
            displayName: 'Restart LibreChat Container App'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                REVISION=$(az containerapp show \
                  --name $(appNameEnvLibreChat) \
                  --resource-group $(resourceGroup) \
                  --query "properties.latestRevisionName" \
                  --output tsv)
                az containerapp revision restart \
                  --name $(appNameEnvLibreChat) \
                  --resource-group $(resourceGroup) \
                  --revision "$REVISION"

  - stage: DeployHelpPage
    displayName: 'Deploy Help Page to Static Web App'
    dependsOn: BicepCreate
    # Run on config/content-only changes too (same rationale as UploadConfigs): the
    # help HTML lives in the repo, so pushing an update should redeploy it even when
    # no .bicep changed (BicepCreate Skipped). Only bail if BicepCreate actually Failed.
    condition: in(dependencies.BicepCreate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
    jobs:
      - job: DeployHelp
        displayName: 'Push romtech_ai_help.html to the SWA'
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy help page via the SWA CLI'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # SWA content deploy needs the deployment token + the Static Web Apps
                # CLI — there is no `az` command to push content to a SWA. Resolve the
                # site by name-prefix within the RG, fetch its token, then deploy the
                # page as index.html so it serves at the site root.
                SWA_NAME=$(az staticwebapp list \
                  --resource-group $(resourceGroup) \
                  --query "[?starts_with(name, 'swa-cgfe')].name | [0]" -o tsv)
                TOKEN=$(az staticwebapp secrets list \
                  --name "$SWA_NAME" \
                  --resource-group $(resourceGroup) \
                  --query "properties.apiKey" -o tsv)
                mkdir -p /tmp/helpsite
                cp "$(Build.SourcesDirectory)/ChatGptForEmployees.docs/romtech_ai_help.html" /tmp/helpsite/index.html
                npx -y @azure/static-web-apps-cli deploy /tmp/helpsite \
                  --deployment-token "$TOKEN" \
                  --env production
