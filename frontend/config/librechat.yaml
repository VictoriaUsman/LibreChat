version: 1.1.5
cache: true

# ROMTech AI Chatbot – LibreChat configuration
# Wires LibreChat to LiteLLM as the sole model gateway.
# Fill in LITELLM_BASE_URL and LITELLM_VIRTUAL_KEY in scripts/.env before starting.

endpoints:
  custom:
    - name: "ROMTech"
      apiKey: "${LITELLM_VIRTUAL_KEY}"
      baseURL: "${LITELLM_BASE_URL}/v1"
      models:
        default:
          - "ROMTech AI Standard"
          - "ROMTech AI Fast"
        fetch: false
      titleConvo: true
      titleModel: "ROMTech AI Standard"
      summarize: false
      summaryModel: "ROMTech AI Standard"
      forcePrompt: false
      modelDisplayLabel: "ROMTech"

fileConfig:
  endpoints:
    custom:
      disabled: false
      fileLimit: 5
      fileSizeLimit: 10
      totalSizeLimit: 50
      supportedMimeTypes:
        - "text/plain"
        - "text/csv"
        - "text/html"
        - "text/markdown"
        - "application/pdf"
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "image/webp"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        - "application/msword"
  serverFileSizeLimit: 100
  avatarSizeLimit: 2
