# LiteLLM — Azure Container Apps Deployment Spec
# -----------------------------------------------------------------------
# Template for deploying LiteLLM to Azure Container Apps (non-prod).
# Replace every <PLACEHOLDER> before deploying.
#
# Deploy with:
#   az containerapp create --resource-group <RG> --yaml litellm_containerapp.yaml
#
# Prerequisites:
#   - An Azure Container Apps environment already exists in the target resource group.
#   - The LITELLM_MASTER_KEY secret value is ready (store in Key Vault for prod).
#
# NOTE: Docker is not used here. Azure Container Apps pulls the image directly
# from the GitHub Container Registry. No local Docker build or push is needed.
#
# Image pinning:
#   Do not use :main-latest in production — it changes without notice.
#   Pin to a specific release tag from: https://github.com/BerriAI/litellm/releases
#   Example: ghcr.io/berriai/litellm:main-v1.57.4
# -----------------------------------------------------------------------

location: <AZURE_REGION>           # e.g. eastus
name: litellm-nonprod
type: Microsoft.App/containerApps

properties:

  # The resource ID of the Container Apps managed environment.
  # Location: Azure Portal > Container Apps Environments > your env > JSON view > id
  environmentId: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.App/managedEnvironments/<ENVIRONMENT_NAME>

  configuration:
    activeRevisionsMode: Single

    ingress:
      external: true          # Reachable from outside the VNet (required for LibreChat to call it)
      targetPort: 4000
      transport: Auto
      allowInsecure: false

    secrets:
      - name: litellm-master-key
        value: <LITELLM_MASTER_KEY>   # Replace with actual value; use Key Vault reference in prod

  template:
    containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-v1.57.4   # Pin to a specific release tag
        resources:
          cpu: 0.5
          memory: 1Gi

        env:
          - name: LITELLM_MASTER_KEY
            secretRef: litellm-master-key
          - name: PORT
            value: "4000"
          - name: LITELLM_ENV
            value: nonprod

        # Health probes — these drive the acceptance criteria for PBI-02-BE.
        # LiteLLM exposes /health/liveliness (is the process alive?)
        # and /health/readiness (is the server ready to accept requests?).
        # Model-level health (/health) is validated in PBI-03-BE after routing is configured.
        probes:
          - type: Liveness
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          - type: Readiness
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

    scale:
      minReplicas: 1    # Keep at least one replica running at all times
      maxReplicas: 2    # Non-prod; increase for prod based on observed load
