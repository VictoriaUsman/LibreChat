# LiteLLM — Validated Phase 0 Routing Configuration
# -----------------------------------------------------------------------
# This file is the validated Phase 0 configuration. Deploy to the LiteLLM
# Azure Container App by mounting it via an Azure File Share.
#
# Secrets are referenced via os.environ/ so they are never stored in this
# file. Set the corresponding environment variables in the Container App
# using Azure Key Vault references and managed identity.
#
# See Phase_0_Findings_v1_Recommendation.md Section 2 for the full
# environment variable reference.
# -----------------------------------------------------------------------

model_list:

  # --- Model 1: ROMTech AI Standard (recommended default) ---
  - model_name: "ROMTech AI Standard"
    litellm_params:
      model: azure/gpt-5.4-mini
      api_base: https://dev-lms-foundry.services.ai.azure.com
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_version: "2024-02-01"
      # TODO: confirm per-token rates for gpt-5.4-mini under the ROMTech Azure agreement
      # Placeholder rates set to 0 until billing admin confirms pricing
      input_cost_per_token: 0.00000000
      output_cost_per_token: 0.00000000

  # --- Model 2: ROMTech AI Fast (high-volume tasks) ---
  - model_name: "ROMTech AI Fast"
    litellm_params:
      model: azure/gpt-5.4-mini
      api_base: https://dev-lms-foundry.services.ai.azure.com
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_version: "2024-02-01"
      # TODO: confirm per-token rates for gpt-5.4-mini under the ROMTech Azure agreement
      # Placeholder rates set to 0 until billing admin confirms pricing
      input_cost_per_token: 0.00000000
      output_cost_per_token: 0.00000000


router_settings:
  num_retries: 2
  timeout: 60
  retry_after: 5
  model_group_alias:
    # Block direct access by Azure deployment name. LiteLLM's fallback routing
    # allows callers to bypass model_name aliases by sending azure/<deployment>
    # directly. Aliasing these to a non-existent target causes routing to fail
    # with a 4xx instead of silently reaching Azure.
    "azure/gpt-5.4-mini": "_blocked_"
    "gpt-5.4-mini": "_blocked_"


litellm_settings:
  # Usage telemetry callback (PBI-XX-BE).
  # Fires after every successful request. Logs a usage payload to stdout and,
  # when TELEMETRY_ENDPOINT_URL is set, POSTs it to the Azure Function (PBI-12-BE).
  #
  # IMPORTANT: Start LiteLLM from the project root so the 'callbacks' package
  # is on the Python path:
  #   cd <project-root>
  #   litellm --config config/litellm_routing_config.yaml
  callbacks: ["callbacks.litellm_usage_callback.proxy_handler_instance"]
  drop_params: true


general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
