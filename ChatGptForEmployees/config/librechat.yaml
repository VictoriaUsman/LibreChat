# LibreChat — Validated Phase 0 Configuration
# -----------------------------------------------------------------------
# Deploy path: /app/librechat.yaml inside the LibreChat container.
# Mount via Azure File Share or bake into the container image.
#
# Replace <LITELLM_ACA_URL> with the LiteLLM Container App URL
# (from Dev 1 handoff — format: <app-name>.<id>.<region>.azurecontainerapps.io).
# LITELLM_VIRTUAL_KEY is injected from the container environment variable —
# do not hardcode the key value here.
#
# See Phase_0_Findings_v1_Recommendation.md Section 2 for the full
# environment variable reference.
# -----------------------------------------------------------------------

version: "1.2.0"
cache: true

# PBI: Enable & Configure Conversation Summarization on v0.8.6.
# SUPERSEDES WI 11300's `summarization.enabled: false` decision for the
# v0.8.6 runtime. Rationale: preserve context past the maxContextTokens cap.
# Without summarization, long sessions hit the cap and LibreChat drops
# the earliest turns entirely (deterministic oldest-first truncation). With
# this block, v0.8.6 prunes those same oldest turns but compresses them into
# a running summary via a dedicated cheap model, so the assistant retains the
# gist of the whole conversation.
#
# PBI: Lower Context Cap to 64k & Verify Summarization Headroom. Retuned
# maxContextTokens 128k -> 64k on both modelSpecs presets below (~halves the
# worst-case per-turn input cost; per-token rates for the deployed gpt-5 models
# live in ChatGptForEmployees.docs/Azure_Pricing.md), while still holding dozens
# of typical turns. This halves every
# figure in the trigger math that follows; re-verified at 64k against
# summarization.stub.e2e.test.ts (recall, failure-mode, no-regression, plus a
# dedicated large-payload test proving the trigger fires correctly and the
# ~12k headroom is comfortable at this cap) before this PBI's config change
# shipped.
#
# Trigger threshold — how "fires before the cap" works in v0.8.6:
#   - `reserveRatio: 0.1` is applied twice by the runtime (once when LibreChat
#     computes the effective context budget: 64,000 x 0.9 = 57,600; once
#     again by the agents-SDK pruner: 57,600 x 0.9 = 51,840), so pruning +
#     summarization begins at ~51.8k tokens ≈ 81% of the 64k cap, leaving
#     ~12k tokens of headroom for the summary call (maxSummaryTokens: 2000)
#     and the model's reply — comfortably more than either needs, so no
#     reserveRatio change was necessary.
#   - `trigger: token_ratio 0.8` gates summarization on ≥80% usage of the
#     effective budget. Summarization only ever runs when pruning has
#     occurred, so this gate is always satisfied at prune time; it is kept
#     explicit to document intent and guard against future default changes.
#   - Conversations that stay under ~51.8k tokens never prune and never
#     summarize — behavior is byte-identical to today (no regression).
#
# Model routing / HIPAA: `provider` names our own custom endpoint, so the
# summary call reuses the LiteLLM Gateway client (same key, same baseURL) and
# only swaps the model to "ROMTech AI Fast" (Azure gpt-5-mini under the
# BAA). No new data boundary; summary calls do not burden gpt-5.
#
# Failure mode (verified in code + test): pruning happens BEFORE the summary
# call, so if the summary LLM call fails the oldest turns are dropped exactly
# as deterministic truncation would drop them, and the failure is logged at
# error level ("Summarization LLM call failed"). Residual caveat: the stock
# v0.8.6 image then labels the dropped span with a one-line
# "[Metadata summary: N messages (...)]" marker — unlike the pre-v0.8 bug,
# this is clearly labeled metadata (not a fake "summary"), and the marker
# tells the model that prior messages existed, which mitigates the old
# "you never asked that" fabrication. Removing the marker entirely would
# require a custom-built image (not config).

# PBI: Harden Nightly Orphaned-File Cleanup — file storage strategy.
# Store uploaded files in Azure Blob rather than the default `local`/file-share
# strategy, so each File record gets source: 'azure_blob'. The nightly cleanup
# job (scripts/cleanup_orphaned_files.py) reclaims orphaned file BYTES via that
# blob source, and storage.bicep provides the soft-delete + versioning recovery
# window. Connection + container come from the AZURE_STORAGE_* env vars in
# ChatGptForEmployees.bicep/libreChat.bicep, where AZURE_STORAGE_PUBLIC_ACCESS
# is forced false so PHI files are never publicly readable (LibreChat defaults
# it to true). VERIFY on first deploy that uploads land in Blob with
# source=azure_blob (deploy-time verification is tracked in the team working notes).
fileStrategy: "azure_blob"

summarization:
  enabled: true
  provider: "LiteLLM Gateway"
  model: "ROMTech AI Fast"
  trigger:
    type: "token_ratio"
    value: 0.8
  reserveRatio: 0.1
  # Cap on the summary the Fast model may emit per compaction (also sets the
  # summary call's max output tokens). ~2k tokens is a rich checkpoint while
  # staying negligible in the rebuilt context.
  maxSummaryTokens: 2000

# PBI 10952 — restrict registration and login to @romtech.com email addresses.
# LibreChat checks the domain of every email at sign-up and social/OIDC login.
# Non-romtech.com addresses are rejected with a clear UI message before any
# session is created. Enforcement on the Okta OIDC path is tracked separately
# once the Okta tile is live.
registration:
  allowedDomains:
    - "romtech.com"

endpoints:
  # File Search (RAG) is surfaced via an ephemeral `file_search` capability on the
  # agents endpoint — NOT the agent builder. interface.agents:false + disableBuilder
  # keep the builder hidden, and the agents endpoint stays out of the model picker
  # (endpointsMenu:false / modelSelect:false / modelSpecs.enforce:true). `artifacts`
  # is listed so the Artifacts tool toggle is preserved (each maps to a feature:
  # artifacts -> the Artifacts toggle in the tools dropdown, file_search -> File
  # Search toggle + "Upload for File Search").
  # NOTE: declaring capabilities explicitly REPLACES the default set — anything
  # omitted is turned OFF, so this list must contain everything we want kept.
  # (code/web_search are intentionally omitted; they're already off via interface
  # runCode/webSearch flags.) This also makes the server-side file_search upload
  # gate deterministic (checkCapability).
  # `context` was removed (previously listed here): it backed the "Upload as Text"
  # option in the paperclip, which inlined a document's full text straight into the
  # 64k context window. Dropping it leaves File Search as the single upload path, so
  # documents are embedded to pgvector and retrieved on demand rather than inlined —
  # the same rationale already documented under interface.fileSearch below. Note this
  # only affects "Upload as Text"; "Upload for File Search" is governed by
  # `file_search` and is unchanged.
  agents:
    disableBuilder: true
    capabilities:
      - file_search
      - artifacts
  custom:
    - name: "LiteLLM Gateway"
      apiKey: "${LITELLM_VIRTUAL_KEY}"
      baseURL: "${LITELLM_URL}/v1"
      models:
        default: ["ROMTech AI Standard"]
        fetch: true
      titleConvo: true
      titleModel: "ROMTech AI Fast"
      # `summarize`/`summaryModel` are not valid custom-endpoint keys in this
      # LibreChat version (silently stripped) — the top-level `summarization:`
      # block above is the real mechanism and is now ENABLED with
      # "ROMTech AI Fast" as the dedicated summary model.
      streamRate: 15

# -----------------------------------------------------------------------
# System prompt — PBI 9575
# -----------------------------------------------------------------------
# STATUS: DRAFT — awaiting sign-off from Legal, HR, and Compliance.
#
# DO NOT deploy to any user-facing environment (ACA nonprod or prod) until
# sign-off is documented in the PR that merges this change.
#
# Sign-off checklist (record approver name + date in the PR description):
#   [ ] Legal
#   [ ] HR
#   [ ] Compliance
#
# Implementation notes:
#   - promptPrefix is set inside each modelSpec preset so it is applied to
#     every conversation regardless of which model the user selects.
#   - interface.parameters: false (below) prevents the prompt from being
#     visible or editable in the LibreChat UI.
#   - modelSpecs.enforce: true ensures no conversation can bypass the specs.
#   - Both model entries carry an identical prompt; update both if the text changes.
# -----------------------------------------------------------------------
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "romtech-ai-standard"
      label: "ROMChat Standard"
      preset:
        endpoint: "LiteLLM Gateway"
        model: "ROMTech AI Standard"
        # "ROMTech AI Standard" is a LiteLLM alias for Azure gpt-5 (2025-08-07; see
        # aiFoundry.bicep for the deployed model + version). LibreChat's token map
        # does not recognize the branded alias and silently falls back to a
        # 4095-token default, dropping earlier turns without warning (PBI: Fix
        # Silent Conversation-History Truncation). Set explicitly to fix that bug,
        # but capped well under the model's full context window (PBI: Address
        # Remaining Review Follow-ups from feat/phase0implementation) -- Azure
        # OpenAI bills per input token, and re-sending a huge context on every
        # turn as a chat grows is a large, mostly-unnecessary cost driver.
        # Lowered 128000 -> 64000 (PBI: Lower Context Cap to 64k & Verify
        # Summarization Headroom) -- ~halves the worst-case per-turn input cost
        # (current gpt-5 per-token rates: ChatGptForEmployees.docs/Azure_Pricing.md)
        # now that summarization (below) carries recall past the cap instead of silent
        # truncation, so the smaller cap no longer costs earlier-turn context.
        # 64k tokens (~225-250k characters) still comfortably retains dozens of
        # turns of typical internal chat/document-review use; only unusually
        # long sessions hit the summarization trigger, which is the deliberate
        # cost/recall trade-off -- see the trigger-math comment above.
        maxContextTokens: 64000
        promptPrefix: |
          You are ROMChat, an internal productivity assistant for ROMTech employees. Your responses are powered by Azure OpenAI through ROMTech's secure AI infrastructure.

          You can help with:
          - Drafting business communications, documents, reports, proposals, and templates
          - Summarizing documents, meeting transcripts, research papers, and lengthy content
          - Analysis: interpreting data, structuring problem-solving, and reviewing processes
          - Research on general business and technical topics
          - Translation of business content between languages
          - Writing, reviewing, and explaining code

          For the following topics, contact the appropriate team directly — do not rely on this assistant:
          - HR matters (benefits, leave, compensation, performance, policies): Contact HR or submit a request through the HR portal.
          - Legal questions (contracts, compliance, intellectual property, regulatory requirements): Contact the Legal team. Do not rely on this assistant for legal advice.
          - Security incidents (suspected phishing, unauthorized access, malware, data breach): Report immediately to IT Security. Do not use this tool first.
          - IT support (hardware, software access, system connectivity): Submit a ticket through the IT helpdesk portal.

          Important:
          - ROMChat is the approved, secure place for sensitive work. It runs on HIPAA-eligible Azure OpenAI services under a Microsoft Business Associate Agreement (BAA), so you can use it with confidential, regulated, and sensitive information — including PHI, client data, and trade secrets. Prefer ROMChat over public AI tools such as ChatGPT or Claude for this content, as those tools are not approved for ROMTech confidential or regulated data. Conversations may be reviewed under ROMTech's Acceptable Use Policy.
          - Responses are AI-generated and may contain errors. Always verify important information before acting on it.
          - This assistant cannot access ROMTech's internal systems, browse the internet, send messages, or take actions on your behalf.

    # default: true — Fast (gpt-5-mini) is the default model for new chats / on
    # sign-in. Cheaper + faster for everyday productivity; users can still switch
    # to Standard via the enforced Standard/Fast buttons for harder tasks.
    - name: "romtech-ai-fast"
      label: "ROMChat Fast"
      default: true
      preset:
        endpoint: "LiteLLM Gateway"
        model: "ROMTech AI Fast"
        # "ROMTech AI Fast" is a LiteLLM alias for Azure gpt-5-mini (2025-08-07; see
        # aiFoundry.bicep for the deployed model + version). Same fallback-to-4095
        # bug as the standard preset above; same fix, and the same 64000 cost/recall
        # cap -- see the rationale on the Standard preset above.
        maxContextTokens: 64000
        promptPrefix: |
          You are ROMChat, an internal productivity assistant for ROMTech employees. Your responses are powered by Azure OpenAI through ROMTech's secure AI infrastructure.

          You can help with:
          - Drafting business communications, documents, reports, proposals, and templates
          - Summarizing documents, meeting transcripts, research papers, and lengthy content
          - Analysis: interpreting data, structuring problem-solving, and reviewing processes
          - Research on general business and technical topics
          - Translation of business content between languages
          - Writing, reviewing, and explaining code

          For the following topics, contact the appropriate team directly — do not rely on this assistant:
          - HR matters (benefits, leave, compensation, performance, policies): Contact HR or submit a request through the HR portal.
          - Legal questions (contracts, compliance, intellectual property, regulatory requirements): Contact the Legal team. Do not rely on this assistant for legal advice.
          - Security incidents (suspected phishing, unauthorized access, malware, data breach): Report immediately to IT Security. Do not use this tool first.
          - IT support (hardware, software access, system connectivity): Submit a ticket through the IT helpdesk portal.

          Important:
          - ROMChat is the approved, secure place for sensitive work. It runs on HIPAA-eligible Azure OpenAI services under a Microsoft Business Associate Agreement (BAA), so you can use it with confidential, regulated, and sensitive information — including PHI, client data, and trade secrets. Prefer ROMChat over public AI tools such as ChatGPT or Claude for this content, as those tools are not approved for ROMTech confidential or regulated data. Conversations may be reviewed under ROMTech's Acceptable Use Policy.
          - Responses are AI-generated and may contain errors. Always verify important information before acting on it.
          - This assistant cannot access ROMTech's internal systems, browse the internet, send messages, or take actions on your behalf.

# Feature governance — validated in Phase 0 (PBI 9130)
# See Phase_0_Findings_v1_Recommendation.md Section 3 for full ledger.
# interface.parameters: false also hides the system prompt from users (PBI 9575).
interface:
  endpointsMenu: false
  # false: the header model dropdown was a second, redundant control alongside
  # the enforced modelSpecs buttons (Standard/Fast) for the same choice. Also
  # hides the API-key gear icon. PBI: Remove Redundant Model Selector.
  modelSelect: false
  agents: false
  memories: false
  bookmarks: false
  prompts: false
  parameters: false
  multiConvo: false
  skills: false
  # false: removes the "Run Code" (Code Interpreter) toggle from the chat UI.
  # That feature requires LibreChat's hosted Code Interpreter API
  # (LIBRECHAT_CODE_API_KEY), which we do not have provisioned — leaving it
  # visible only surfaces a toggle that 403s against api.librechat.ai on use.
  runCode: false
  # false: removes the "Web Search" toggle from the chat UI. Web search
  # requires configured search/scraper provider keys (e.g. SERPER_API_KEY,
  # FIRECRAWL_API_KEY / JINA) which we do not have provisioned, and outbound
  # web access is out of scope for this internal tool.
  webSearch: false
  # true: exposes File Search (RAG). Surfaces the "File Search" tool toggle and the
  # "Upload for File Search" attachment option so documents are embedded to pgvector
  # and retrieved on demand, instead of inlined into the 64k context. Set EXPLICITLY
  # (not just the schema default) so the FILE_SEARCH.USE permission refreshes past
  # any stale value persisted in the DB from an earlier config. Needs a container
  # restart for the permission sync to run.
  fileSearch: true
  # -----------------------------------------------------------------------
  # ROMTech branding (config-level) — PBI: Apply ROMTech Branding
  # -----------------------------------------------------------------------
  # STATUS: DRAFT — awaiting sign-off from Comms/Legal, same as the system
  # prompt above. DO NOT deploy to any user-facing environment until sign-off
  # is documented in the PR that merges this change.
  #   [ ] Comms
  #   [ ] Legal
  customWelcome: "Welcome to ROMChat."
  # privacyPolicy / termsOfService intentionally omitted: no ROMTech-hosted
  # Privacy Policy or Terms of Service URL exists yet (the Acceptable Use
  # Policy is currently an internal draft doc, not a published page — see
  # ChatGptForEmployees.docs/acceptable_use_policy.md). Add
  # interface.privacyPolicy.externalUrl / interface.termsOfService.externalUrl
  # once Legal publishes a hosted URL; until then this omission is the
  # documented sign-off decision for this AC.

# File upload — enabled for v1 (PBI 9563)
# Restricted to approved MIME types and size limits.
# Local dev: files stored in LibreChat's default uploads directory.
fileConfig:
  endpoints:
    custom:
      disabled: false
      fileLimit: 5
      fileSizeLimit: 10
      totalSizeLimit: 50
      supportedMimeTypes:
        - "text/plain"
        - "text/csv"
        - "text/markdown"
        - "application/pdf"
        # Image MIME types intentionally REMOVED — image/vision input is not
        # supported (no vision budget under the 64k cost cap, and text-embedding-3-
        # small cannot embed images for RAG). Without this, an image is accepted at
        # upload and then crashes the turn ("empty_messages": the base64 image blows
        # past the context budget). Blocking at the MIME layer rejects images cleanly
        # at the paperclip instead. Re-add these types if vision is ever scoped in.
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        - "application/msword"
  serverFileSizeLimit: 100
  avatarSizeLimit: 2
