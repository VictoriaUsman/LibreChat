# LibreChat — Validated Phase 0 Configuration
# -----------------------------------------------------------------------
# Deploy path: /app/librechat.yaml inside the LibreChat container.
# Mount via Azure File Share or bake into the container image.
#
# Replace <LITELLM_ACA_URL> with the LiteLLM Container App URL
# (from Dev 1 handoff — format: <app-name>.<id>.<region>.azurecontainerapps.io).
# LITELLM_VIRTUAL_KEY is injected from the container environment variable —
# do not hardcode the key value here.
#
# See Phase_0_Findings_v1_Recommendation.md Section 2 for the full
# environment variable reference.
# -----------------------------------------------------------------------

version: "1.2.0"
cache: true

# PBI: Verify or Disable Conversation Summarization on the Custom Endpoint.
# The per-endpoint `summarize`/`summaryModel` keys below (LiteLLM Gateway) are
# dead in this LibreChat version — the custom-endpoint schema silently strips
# them, so `summarize: true` never did anything. The real mechanism is a
# separate "self-summarize" feature that is ON BY DEFAULT whenever this
# `summarization` block is absent: on context overflow it asks the
# conversation's OWN model (no dedicated summary model) to summarize dropped
# turns, and on failure falls back to a content-free metadata stub instead of
# real prior content — a plausible cause of the reported "you never asked
# that" bug (the model sees a stub, not a summary). Disabled here in favor of
# deterministic oldest-first truncation, since PBI-01-FE's maxContextTokens
# fix makes overflow rare and the failure mode is worse than plain truncation.
summarization:
  enabled: false

# PBI 10952 — restrict registration and login to @romtech.com email addresses.
# LibreChat checks the domain of every email at sign-up and social/OIDC login.
# Non-romtech.com addresses are rejected with a clear UI message before any
# session is created. Enforcement on the Okta OIDC path is tracked separately
# once the Okta tile is live.
registration:
  allowedDomains:
    - "romtech.com"

endpoints:
  custom:
    - name: "LiteLLM Gateway"
      apiKey: "${LITELLM_VIRTUAL_KEY}"
      baseURL: "${LITELLM_URL}/v1"
      models:
        default: ["ROMTech AI Standard"]
        fetch: true
      titleConvo: true
      titleModel: "ROMTech AI Fast"
      # `summarize`/`summaryModel` are not valid custom-endpoint keys in this
      # LibreChat version (silently stripped) — see `summarization:` above,
      # which is the actual on/off switch for this endpoint's context handling.
      streamRate: 15

# -----------------------------------------------------------------------
# System prompt — PBI 9575
# -----------------------------------------------------------------------
# STATUS: DRAFT — awaiting sign-off from Legal, HR, and Compliance.
#
# DO NOT deploy to any user-facing environment (ACA nonprod or prod) until
# sign-off is documented in the PR that merges this change.
#
# Sign-off checklist (record approver name + date in the PR description):
#   [ ] Legal
#   [ ] HR
#   [ ] Compliance
#
# Implementation notes:
#   - promptPrefix is set inside each modelSpec preset so it is applied to
#     every conversation regardless of which model the user selects.
#   - interface.parameters: false (below) prevents the prompt from being
#     visible or editable in the LibreChat UI.
#   - modelSpecs.enforce: true ensures no conversation can bypass the specs.
#   - Both model entries carry an identical prompt; update both if the text changes.
# -----------------------------------------------------------------------
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "romtech-ai-standard"
      label: "ROMTech AI Standard"
      default: true
      preset:
        endpoint: "LiteLLM Gateway"
        model: "ROMTech AI Standard"
        # "ROMTech AI Standard" is a LiteLLM alias for Azure gpt-4.1 (2025-04-14),
        # real context window: 1,047,576 tokens (see aiFoundry.bicep). LibreChat's
        # token map does not recognize the branded name and silently falls back to
        # a 4095-token default, dropping earlier turns without warning (PBI: Fix
        # Silent Conversation-History Truncation). Set explicitly, capped below the
        # real window to reserve headroom for the model's max output (32,768 tokens)
        # plus prompt/tool overhead.
        maxContextTokens: 1000000
        promptPrefix: |
          You are ROMTech AI, an internal productivity assistant for ROMTech employees. Your responses are powered by Azure OpenAI through ROMTech's secure AI infrastructure.

          You can help with:
          - Drafting business communications, documents, reports, proposals, and templates
          - Summarizing documents, meeting transcripts, research papers, and lengthy content
          - Analysis: interpreting data, structuring problem-solving, and reviewing processes
          - Research on general business and technical topics
          - Translation of business content between languages
          - Writing, reviewing, and explaining code

          For the following topics, contact the appropriate team directly — do not rely on this assistant:
          - HR matters (benefits, leave, compensation, performance, policies): Contact HR or submit a request through the HR portal.
          - Legal questions (contracts, compliance, intellectual property, regulatory requirements): Contact the Legal team. Do not rely on this assistant for legal advice.
          - Security incidents (suspected phishing, unauthorized access, malware, data breach): Report immediately to IT Security. Do not use this tool first.
          - IT support (hardware, software access, system connectivity): Submit a ticket through the IT helpdesk portal.

          Important:
          - Do not enter confidential client data, personal data of colleagues or customers, or trade secrets into this assistant. Conversations may be reviewed under ROMTech's Acceptable Use Policy.
          - Responses are AI-generated and may contain errors. Always verify important information before acting on it.
          - This assistant cannot access ROMTech's internal systems, browse the internet, send messages, or take actions on your behalf.

    - name: "romtech-ai-fast"
      label: "ROMTech AI Fast"
      preset:
        endpoint: "LiteLLM Gateway"
        model: "ROMTech AI Fast"
        # "ROMTech AI Fast" is a LiteLLM alias for Azure gpt-4.1-mini (2025-04-14),
        # which shares the gpt-4.1 family's 1,047,576-token context window (see
        # aiFoundry.bicep). Same fallback-to-4095 bug as the standard preset above;
        # same fix. Capped below the real window to reserve headroom for the
        # model's max output (32,768 tokens) plus prompt/tool overhead.
        maxContextTokens: 1000000
        promptPrefix: |
          You are ROMTech AI, an internal productivity assistant for ROMTech employees. Your responses are powered by Azure OpenAI through ROMTech's secure AI infrastructure.

          You can help with:
          - Drafting business communications, documents, reports, proposals, and templates
          - Summarizing documents, meeting transcripts, research papers, and lengthy content
          - Analysis: interpreting data, structuring problem-solving, and reviewing processes
          - Research on general business and technical topics
          - Translation of business content between languages
          - Writing, reviewing, and explaining code

          For the following topics, contact the appropriate team directly — do not rely on this assistant:
          - HR matters (benefits, leave, compensation, performance, policies): Contact HR or submit a request through the HR portal.
          - Legal questions (contracts, compliance, intellectual property, regulatory requirements): Contact the Legal team. Do not rely on this assistant for legal advice.
          - Security incidents (suspected phishing, unauthorized access, malware, data breach): Report immediately to IT Security. Do not use this tool first.
          - IT support (hardware, software access, system connectivity): Submit a ticket through the IT helpdesk portal.

          Important:
          - Do not enter confidential client data, personal data of colleagues or customers, or trade secrets into this assistant. Conversations may be reviewed under ROMTech's Acceptable Use Policy.
          - Responses are AI-generated and may contain errors. Always verify important information before acting on it.
          - This assistant cannot access ROMTech's internal systems, browse the internet, send messages, or take actions on your behalf.

# Feature governance — validated in Phase 0 (PBI 9130)
# See Phase_0_Findings_v1_Recommendation.md Section 3 for full ledger.
# interface.parameters: false also hides the system prompt from users (PBI 9575).
interface:
  endpointsMenu: false
  # false: the header model dropdown was a second, redundant control alongside
  # the enforced modelSpecs buttons (Standard/Fast) for the same choice. Also
  # hides the API-key gear icon. PBI: Remove Redundant Model Selector.
  modelSelect: false
  agents: false
  memories: false
  bookmarks: false
  prompts: false
  parameters: false
  multiConvo: false
  skills: false
  # -----------------------------------------------------------------------
  # ROMTech branding (config-level) — PBI: Apply ROMTech Branding
  # -----------------------------------------------------------------------
  # STATUS: DRAFT — awaiting sign-off from Comms/Legal, same as the system
  # prompt above. DO NOT deploy to any user-facing environment until sign-off
  # is documented in the PR that merges this change.
  #   [ ] Comms
  #   [ ] Legal
  customWelcome: "Welcome to ROMTech AI. Conversations may be reviewed under ROMTech's Acceptable Use Policy — avoid entering confidential client data, personal data, or trade secrets."
  # privacyPolicy / termsOfService intentionally omitted: no ROMTech-hosted
  # Privacy Policy or Terms of Service URL exists yet (the Acceptable Use
  # Policy is currently an internal draft doc, not a published page — see
  # ChatGptForEmployees.docs/acceptable_use_policy.md). Add
  # interface.privacyPolicy.externalUrl / interface.termsOfService.externalUrl
  # once Legal publishes a hosted URL; until then this omission is the
  # documented sign-off decision for this AC.

# File upload — enabled for v1 (PBI 9563)
# Restricted to approved MIME types and size limits.
# Local dev: files stored in LibreChat's default uploads directory.
fileConfig:
  endpoints:
    custom:
      disabled: false
      fileLimit: 5
      fileSizeLimit: 10
      totalSizeLimit: 50
      supportedMimeTypes:
        - "text/plain"
        - "text/csv"
        - "text/markdown"
        - "application/pdf"
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "image/webp"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        - "application/msword"
  serverFileSizeLimit: 100
  avatarSizeLimit: 2
