# LiteLLM — Routing Configuration (GPT-5 family: failover + spend attribution)
# -----------------------------------------------------------------------
# THIS committed file is the deployed config for EVERY environment. The deploy
# pipelines (ChatGptForEmployees.pipelines/{dev,test,prod}.yml) upload it verbatim
# to each env's Azure Files share — there is NO per-env "template fill" step, and no
# `.template` (removed 2026-07-20). It is env-agnostic because every secret/endpoint
# is an os.environ/ ref resolved from that env's container env vars (Key Vault +
# managed identity). So a change here applies to dev, test, AND prod on next deploy.
#
# MODELS (the azure/<name> refs MUST match the deployment names in
# ChatGptForEmployees.bicep/aiFoundry.bicep):
#   Standard tier — primary romtech-standard (gpt-5), failover romtech-standard-backup (gpt-5.1)
#   Fast tier     — primary romtech-fast (gpt-5-mini), failover romtech-fast-backup (gpt-5.4-mini)
# Only the two PRIMARY model_names ("ROMTech AI Standard" / "ROMTech AI Fast") are
# offered to users in LibreChat. The *-Backup entries are kept as SEPARATE model_names
# (NOT extra deployments of the same name) so LiteLLM never load-balances normal
# traffic onto the pricier backups — they are reached ONLY on failover (see
# router_settings.fallbacks below), i.e. when the primary 429s / errors.
#
# COST REGISTRATION (model_info.*_cost_per_token) is REQUIRED so LiteLLM_SpendLogs.spend
# is non-zero — LiteLLM can't price the custom azure/romtech-* deployment names.
# per-token = (Azure_Pricing.md GlobalStandard $ per 1M) / 1,000,000:
#   gpt-5        $1.25 in / $10.00 out      gpt-5.1      $1.25 in / $10.00 out
#   gpt-5-mini   $0.25 in /  $2.00 out      gpt-5.4-mini $0.75 in /  $4.50 out
#
# ⚠️ VERIFY BEFORE TRUSTING THIS CONFIG: api_version "2024-10-21" was chosen for
# gpt-4.1. Confirm it actually serves the GPT-5 models on this Azure resource — if
# not, every call 400s and it must be bumped (e.g. a 2024-12-01-preview or later).
# Flagged in the reconcile/santi-launch-prep review.
# -----------------------------------------------------------------------

model_list:

  # --- Standard tier: PRIMARY (gpt-5) ---
  - model_name: "ROMTech AI Standard"
    litellm_params:
      model: azure/romtech-standard
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_version: "2024-10-21"
      additional_drop_params: ["max_tokens"]
    model_info:
      base_model: azure/gpt-5
      input_cost_per_token: 0.00000125     # $1.25 / 1M
      output_cost_per_token: 0.00001       # $10.00 / 1M

  # --- Standard tier: FAILOVER (gpt-5.1) — internal; reached only via fallbacks ---
  - model_name: "ROMTech AI Standard Backup"
    litellm_params:
      model: azure/romtech-standard-backup
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_version: "2024-10-21"
      additional_drop_params: ["max_tokens"]
    model_info:
      base_model: azure/gpt-5.1
      input_cost_per_token: 0.00000125     # $1.25 / 1M
      output_cost_per_token: 0.00001       # $10.00 / 1M

  # --- Fast tier: PRIMARY (gpt-5-mini) ---
  - model_name: "ROMTech AI Fast"
    litellm_params:
      model: azure/romtech-fast
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_version: "2024-10-21"
      additional_drop_params: ["max_tokens"]
    model_info:
      base_model: azure/gpt-5-mini
      input_cost_per_token: 0.00000025     # $0.25 / 1M
      output_cost_per_token: 0.000002      # $2.00 / 1M

  # --- Fast tier: FAILOVER (gpt-5.4-mini) — internal; reached only via fallbacks ---
  - model_name: "ROMTech AI Fast Backup"
    litellm_params:
      model: azure/romtech-fast-backup
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_version: "2024-10-21"
      additional_drop_params: ["max_tokens"]
    model_info:
      base_model: azure/gpt-5.4-mini
      input_cost_per_token: 0.00000075     # $0.75 / 1M
      output_cost_per_token: 0.0000045     # $4.50 / 1M


router_settings:
  num_retries: 2          # Retry transient Azure errors on the primary first
  timeout: 60             # Seconds before a request is abandoned
  retry_after: 5          # Seconds between retries
  # TRUE FAILOVER (not load-balancing): each primary falls over to its dedicated
  # backup model_name only AFTER num_retries is exhausted (429 / transient error).
  # Because the backups carry their own model_names, normal traffic never touches
  # the pricier gpt-5.1 / gpt-5.4-mini.
  # ⚠️ Verify this key's placement against litellm v1.57.4 — `fallbacks` has lived
  # under both `router_settings` and `litellm_settings` across versions. If failover
  # doesn't trigger in testing, move this block to litellm_settings.
  fallbacks:
    - "ROMTech AI Standard": ["ROMTech AI Standard Backup"]
    - "ROMTech AI Fast": ["ROMTech AI Fast Backup"]


litellm_settings:
  drop_params: true       # Silently ignore params Azure doesn't support


general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Per-user spend attribution: LiteLLM records the request `user` field (the Mongo
  # _id LibreChat sends) into LiteLLM_SpendLogs.end_user, which the department rollup
  # joins on. LiteLLM logs end_user by DEFAULT; this opt-in is kept for parity —
  # confirm its exact effect against the pinned image (it may be a no-op).
  allow_user_requests: true
