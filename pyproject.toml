[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romtech-mcp"
version = "0.1.0"
description = "ROMTech MCP server — CX1 reporting integration"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.28",
    "azure-identity>=1.19,<2",
    "azure-keyvault-secrets>=4.9,<5",
    # azure-identity's async credentials (azure.identity.aio) require an
    # async HTTP transport and do not pull one in themselves — confirmed by
    # actually constructing ManagedIdentityCredential without it, which
    # raises ImportError at first use, not at import time.
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
