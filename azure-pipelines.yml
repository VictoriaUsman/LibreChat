# ROMChat — LibreChat fork image build.
#
# Builds THIS fork's source into a container image and pushes it to the dev ACR
# (acrcgfedev), server-side via `az acr build` (ACR Tasks) — no Docker agent needed,
# mirroring the infra repo's BuildJobsImage stage (ChatGptForEmployees.pipelines/dev.yml).
#
# The image is pinned for deployment BY DIGEST: this pipeline prints the sha256 digest
# at the end; that digest goes into ChatGptForEmployees main.<env>.bicepparam
# (libreChatImage) to deploy. We never deploy a mutable tag.
#
# SCOPE (Stage 1.3): dev ACR only. Promotion to test/prod ACRs (acrcgfetest/-prod) is a
# later step — either build there too or `az acr import` the same digest across registries.

trigger:
  branches:
    include:
      - main
  # Doc-only commits (PATCHES.md, READMEs, any *.md) don't change the image, so they must
  # NOT trigger a full ~10-min build. Any non-.md change (source, Dockerfile, deps) still
  # builds: ADO fires the trigger when a commit touches at least one non-excluded path.
  #
  # BOTH patterns are required. `**/*.md` matches only .md files at least one directory
  # deep — it does NOT match root-level files, so `*.md` covers PATCHES.md,
  # ROMCHAT_DEV_GUIDE.md, README.md, etc. Verified the hard way on 2026-07-29: a push of
  # two root-level .md files triggered a full build when only `**/*.md` was listed.
  #
  # Belt and braces: `[skip ci]` in a commit message suppresses the trigger regardless of
  # path filters. Use it for any push that can't affect the image.
  paths:
    exclude:
      - '*.md'
      - '**/*.md'

pool:
  vmImage: ubuntu-latest

variables:
  - name: acrName
    value: acrcgfedev
  # The image is BUILT once, into acrcgfedev, then copied byte-for-byte into the other two
  # registries by the MirrorImage stage below. At runtime each environment pulls only from its
  # own registry and never reads another environment's — the copy happens here, in CI.
  - name: acrTestName
    value: acrcgfetest
  - name: acrProdName
    value: acrcgfeprod
  - name: imageRepo
    value: librechat
  - name: serviceConnection
    value: ChatGptForEmployeesDevSC

name: ROMChatLibreFork_$(Build.SourceBranch)_$(Date:yyyyMMdd).$(Rev:r)

stages:
  - stage: BuildImage
    displayName: 'Build & push LibreChat fork image'
    jobs:
      - job: AcrBuild
        displayName: 'az acr build -> acrcgfedev/librechat'
        steps:
          - task: AzureCLI@2
            name: BuildStep
            displayName: 'Build & push image (server-side in ACR)'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Provenance stamped into the image (surfaced in Settings -> About): lets us
                # map a running digest back to the exact fork commit — important for a
                # PHI-adjacent app deployed by opaque digest. The Dockerfile declares these
                # args AFTER the heavy layers, so setting them does NOT bust the build cache.
                BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

                # Build the fork root (context = ".", Dockerfile at root). Tag by build id as
                # a human-readable handle; the immutable digest below is the deploy pin.
                # --platform pins linux/amd64 (what Azure Container Apps runs) so a future
                # agent/default change can't silently produce a different arch.
                az acr build \
                  --registry $(acrName) \
                  --image $(imageRepo):$(Build.BuildId) \
                  --platform linux/amd64 \
                  --build-arg BUILD_COMMIT=$(Build.SourceVersion) \
                  --build-arg BUILD_BRANCH=$(Build.SourceBranchName) \
                  --build-arg BUILD_DATE=$BUILD_DATE \
                  --file Dockerfile \
                  .

                # Resolve the immutable digest to paste into main.<env>.bicepparam.
                DIGEST=$(az acr repository show \
                  --name $(acrName) \
                  --image $(imageRepo):$(Build.BuildId) \
                  --query digest -o tsv)

                # Hand the digest to the MirrorImage stage. Resolving it once and passing it on
                # is deliberate: re-resolving per registry would invite a copy that silently
                # mirrors something other than what this run built.
                echo "##vso[task.setvariable variable=imageDigest;isOutput=true]${DIGEST}"

                echo ""
                echo "=================================================================="
                echo "Image pushed. Deploy by DIGEST (put this in libreChatImage):"
                echo "  $(acrName).azurecr.io/$(imageRepo)@${DIGEST}"
                echo ""
                echo "Use the SAME digest for every environment — only the registry host"
                echo "changes. MirrorImage copies it to test and prod next:"
                echo "  $(acrTestName).azurecr.io/$(imageRepo)@${DIGEST}"
                echo "  $(acrProdName).azurecr.io/$(imageRepo)@${DIGEST}"
                echo "=================================================================="

  - stage: MirrorImage
    displayName: 'Copy image to test + prod registries'
    dependsOn: BuildImage
    condition: succeeded('BuildImage')
    variables:
      imageDigest: $[ stageDependencies.BuildImage.AcrBuild.outputs['BuildStep.imageDigest'] ]
    jobs:
      - job: Mirror
        displayName: 'az acr import -> acrcgfetest, acrcgfeprod'
        steps:
          - task: AzureCLI@2
            displayName: 'Copy the built digest into the other environment registries'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                DIGEST="$(imageDigest)"
                if [ -z "$DIGEST" ]; then
                  echo "##vso[task.logissue type=error]No digest received from BuildImage."
                  exit 1
                fi

                # Copy, don't rebuild. `az acr import` transfers the manifest as-is, so every
                # registry ends up with the identical digest and test/prod run exactly the bytes
                # dev validated. Building per environment would produce three different digests —
                # BUILD_DATE alone guarantees it, and dependency resolution can drift between
                # runs — which would mean prod running an artifact nobody had ever executed.
                for TARGET in $(acrTestName) $(acrProdName); do
                  echo "----------------------------------------------------------------"
                  if az acr repository show --name "$TARGET" \
                       --image "$(imageRepo)@${DIGEST}" --output none 2>/dev/null; then
                    echo "${TARGET}: already has ${DIGEST} — skipping."
                    continue
                  fi

                  echo "${TARGET}: importing ${DIGEST}..."
                  if ! az acr import --name "$TARGET" \
                         --source "$(acrName).azurecr.io/$(imageRepo)@${DIGEST}" \
                         --image "$(imageRepo)@${DIGEST}"; then
                    echo "##vso[task.logissue type=error]Import into ${TARGET} failed. If this is an authorization error, the $(serviceConnection) service principal needs push rights (AcrPush) on ${TARGET} as well as read on $(acrName)."
                    exit 1
                  fi

                  # Verify rather than assume: a missing image in a target registry only shows up
                  # much later, as a promotion whose new revision never goes healthy.
                  az acr repository show --name "$TARGET" \
                    --image "$(imageRepo)@${DIGEST}" \
                    --query "{registry:'${TARGET}', digest:digest, arch:architecture}" -o json
                done

                echo "----------------------------------------------------------------"
                echo "Digest present in all three registries. Promotion needs no image work."
